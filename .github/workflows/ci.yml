name: BuildFlow CI - Security, Quality & Release Gate

on:
  push:
    branches: [ "main", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: PHP 8.5 & MySQL Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: buildflow_crm
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, fileinfo, openssl, ctype, json, tokenizer, curl, zip
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Install NPM Dependencies & Compile Assets
        run: |
          npm ci
          npm run build

      - name: Configure Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing

      - name: Run Database Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: buildflow_crm
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Execute Full PHPUnit Test Suite
        run: php artisan test --colors=always
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: buildflow_crm
          DB_USERNAME: root
          DB_PASSWORD: root
          BACKUP_STORAGE_PATH: storage/app/backups
          BACKUP_SECONDARY_PATH: storage/app/backups_secondary
          BACKUP_ENCRYPT: true
          BACKUP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Run Release Preflight Gate (Advisory)
        run: php artisan buildflow:preflight
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: buildflow_crm
          DB_USERNAME: root
          DB_PASSWORD: root
